<p-floatlabel [variant]="variant()" class="w-full block">
  @if (field(); as f) {
    <p-multiselect
      [inputId]="inputId()"
      [appendTo]="appendTo()"
      [options]="options()"
      [formField]="f"
      [showClear]="showClear()"
      [filter]="filter()"
      [optionLabel]="optionLabel()"
      [optionValue]="optionValue()"
      [placeholder]="placeholder() ? (placeholder() | translate) : ''"
      [loading]="loading()"
      [display]="display()"
      [fluid]="true"
      styleClass="w-full"
      (onChange)="onChange.emit($event)"
    >
      <ng-template #item let-option>
        <span>{{ (option[optionLabel()] ?? option) | translate }}</span>
      </ng-template>
    </p-multiselect>
  } @else {
    <p-multiselect
      [inputId]="inputId()"
      [appendTo]="appendTo()"
      [options]="options()"
      [(ngModel)]="ngModel"
      [showClear]="showClear()"
      [filter]="filter()"
      [optionLabel]="optionLabel()"
      [optionValue]="optionValue()"
      [placeholder]="placeholder() ? (placeholder() | translate) : ''"
      [loading]="loading()"
      [display]="display()"
      [fluid]="true"
      styleClass="w-full"
      (onChange)="onChange.emit($event)"
    >
      <ng-template #item let-option>
        <span>{{ (option[optionLabel()] ?? option) | translate }}</span>
      </ng-template>
    </p-multiselect>
  }
  @if (label()) {
    <label [for]="inputId()">
      {{ label() | translate }}
    </label>
  }
</p-floatlabel>

@if (showError()) {
  <div
    [id]="errorId()"
    role="alert"
    class="text-red-500 text-xs font-medium mt-1.5 ml-1 flex items-center gap-1"
  >
    <svg
      class="w-3.5 h-3.5 shrink-0"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 20 20"
      fill="currentColor"
      aria-hidden="true"
    >
      <path
        fill-rule="evenodd"
        d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
        clip-rule="evenodd"
      />
    </svg>
    <span>{{ errorMessage() | translate }}</span>
  </div>
}
