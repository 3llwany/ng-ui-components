<button
  pButton
  [class]="'w-full py-3! rounded-xl! font-bold border-none ' + (styleClass() ?? '')"
  [ngClass]="{
    'bg-linear-to-r! from-primary-600 to-primary-500 shadow-lg shadow-primary-500/25 ':
      severity() === 'primary' && !outlined(),
  }"
  [severity]="severity()"
  [rounded]="rounded()"
  [disabled]="disabled() || loading()"
  [loading]="loading()"
  [outlined]="outlined()"
  [type]="type()"
  (click)="Click()"
>
  <ng-content select="[prefixIcon]"></ng-content>
  <!-- <ng-content select=".prefixIcon" /> -->
  {{ label() | translate }}
  <!-- <ng-content select=".suffixIcon" /> -->
  <ng-content select="[suffixIcon]"></ng-content>
</button>
