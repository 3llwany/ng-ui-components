<button
  pButton
  [class]="
    'w-full py-3! rounded-xl! font-bold' +
    (outlined() || variant() === 'outlined' ? '' : 'border-none ') +
    (styleClass() ?? '')
  "
  [severity]="severity()"
  [variant]="variant()"
  [rounded]="rounded()"
  [disabled]="disabled() || loading()"
  [loading]="loading()"
  [outlined]="outlined()"
  [type]="type()"
  (click)="Click()"
>
  <!-- NOTE: prefix Icon -->
  <!-- <ng-content select="[prefixIcon]"></ng-content> -->
  @if (iconPos() === 'left' && icon() !== null) {
    <svg
      [class]="'w-4! h-4!' + (directionalIcon() ? ' inline-block rtl:scale-x-[-1]' : '')"
      [pIcon]="icon()!"
    ></svg>
  }

  {{ label() | translate }}

  <!-- NOTE: suffix Icon -->
  @if (iconPos() === 'right' && icon() !== null) {
    <svg
      [class]="'w-4! h-4!' + (directionalIcon() ? ' inline-block rtl:scale-x-[-1]' : '')"
      [pIcon]="icon()!"
    ></svg>
  }
  <!-- <ng-content select="[suffixIcon]"></ng-content> -->
</button>
