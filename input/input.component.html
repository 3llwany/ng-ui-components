<p-floatlabel [variant]="variant">
  <p-iconfield>
    @if (isPrefix()) {
      <p-inputicon>
        <ng-content select=".prefixIcon"></ng-content>
      </p-inputicon>
    }

    <!-- text input  -->
    @if (type() == 'text') {
      <input
        pInputText
        [class]="styleClass()"
        [class.p-filled]="control().value"
        [step]="step()"
        [type]="type()"
        [id]="id() ? 'str' + id() : 'str_' + uniqueId + label()"
        [formControl]="control()"
        [readonly]="readonly()"
        [autocomplete]="autocomplete()"
        (keyup)="onkeyup($event.target)"
        (keydown)="onkeydown($event.target)"
        (keypress)="onkeypress($event.target)"
        (keyup.enter)="onKeyEnter($event.target)"
        (blur)="onBlur($event.target)"
        (change)="onChange($event.target)"
        class="w-full pl-11 pr-4 py-3 border-surface-200 text-surface-900 rounded-xl focus:border-primary-500 shadow-sm"
      />
    }

    <!-- number input -->
    @else if (type() == 'number') {
      <p-inputnumber
        [class]="styleClass()"
        [step]="step()"
        [id]="id() ? 'number' + id() : 'number_' + uniqueId + label()"
        [formControl]="control()"
        [autocomplete]="autocomplete()"
        [showButtons]="true"
        [readonly]="readonly() || disabled()"
        [class.readonly-inputNumber]="readonly()"
        [maxFractionDigits]="isDecimalNumber() ? 10 : null"
        [format]="isDecimalNumber()"
        incrementButtonClass="incClass"
        decrementButtonClass="decClass"
        class="w-100 {{ disabled() ? 'bg-disabled' : '' }}"
        (onInput)="_onInput(control().value)"
        (keyup)="onkeyup($event.target)"
        (keydown)="onkeydown($event.target)"
        (keypress)="onkeypress($event.target)"
        (keyup.enter)="onKeyEnter($event.target)"
        (onBlur)="onBlur($event.target)"
        (onFocus)="onFocus($event.target)"
        (change)="onChange($event.target)"
        class="w-full pl-11 pr-4 py-3 border-surface-200 text-surface-900 rounded-xl focus:border-primary-500 shadow-sm"
      >
      </p-inputnumber>
    }

    <!-- number password -->
    @else if (type() == 'password') {
      <input
        pInputPassword
        [size]="inputSize"
        [formControl]="control()"
        [mask]="true"
        [class]="styleClass()"
        [fluid]="true"
        [id]="id() ? 'pass' + id() : 'pass_' + uniqueId + label()"
        [autocomplete]="autocomplete()"
        (keyup)="onkeyup($event.target)"
        (keydown)="onkeydown($event.target)"
        (keypress)="onkeypress($event.target)"
        (keyup.enter)="onKeyEnter($event.target)"
        (blur)="onBlur($event.target)"
        (change)="onChange($event.target)"
        class="w-full pl-11 pr-4 py-3 border-surface-200 text-surface-900 rounded-xl focus:border-primary-500 shadow-sm"
      />
    }

    <p-inputicon>
      @if (isSuffix()) {
        <ng-content select=".suffixIcon"></ng-content>
      }
    </p-inputicon>
  </p-iconfield>
  <label [for]="id() ? 'str' + id() : 'str_' + uniqueId + label()">
    {{ label() | translate }}
  </label>
</p-floatlabel>
